version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - misspell
    - revive
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # Test helpers assert on struct fields, not on every error return.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
